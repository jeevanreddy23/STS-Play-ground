<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STS Second Brain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fcfcfb'/%3E%3Ccircle cx='10' cy='11' r='3.5' fill='%232a78d6'/%3E%3Ccircle cx='22' cy='9' r='2.5' fill='%23eb6834'/%3E%3Ccircle cx='19' cy='22' r='3' fill='%231baf7a'/%3E%3Cpath d='M10 11 L22 9 M10 11 L19 22 M22 9 L19 22' stroke='%23898781' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --plane: #f2f2ef; --sidebar: #f7f7f4;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --line: #e1e0d9; --accent: #2a78d6; --accent-soft: #e7f0fb;
    --link: #1c5cab; --tag: #eb6834; --border-ring: rgba(11,11,11,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      color-scheme: dark;
      --surface: #1a1a19; --plane: #0d0d0d; --sidebar: #151514;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --line: #2c2c2a; --accent: #3987e5; --accent-soft: #17263a;
      --link: #86b6ef; --tag: #d95926; --border-ring: rgba(255,255,255,.12);
    }
  }
  :root[data-theme=dark] {
    color-scheme: dark;
    --surface: #1a1a19; --plane: #0d0d0d; --sidebar: #151514;
    --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --accent: #3987e5; --accent-soft: #17263a;
    --link: #86b6ef; --tag: #d95926; --border-ring: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; color: var(--ink); background: var(--plane);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header .sub { font-size: 11.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; font: inherit; font-size: 12px;
    padding: 4px 11px; cursor: pointer; color: var(--ink2);
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button + button { border-left: 1px solid var(--line); }
  .iconbtn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #search {
    flex: 1; min-width: 180px; max-width: 420px; padding: 5px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--plane); color: var(--ink);
  }

  .main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 250px; flex: none; background: var(--sidebar);
    border-right: 1px solid var(--line); overflow-y: auto; padding-bottom: 24px;
  }
  nav .group { padding: 10px 12px 3px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  nav a.note {
    display: block; padding: 4px 12px; font-size: 13px; color: var(--ink);
    text-decoration: none; border-left: 2px solid transparent; cursor: pointer;
  }
  nav a.note:hover { background: var(--plane); }
  nav a.note.active { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  nav a.note .snip { display: block; font-size: 10.5px; color: var(--muted); }

  .tags { padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink2);
  }
  .tag.on { border-color: var(--tag); color: var(--tag); font-weight: 650; }
  .tag .n { color: var(--muted); }

  main { flex: 1; overflow-y: auto; min-width: 0; }
  article { max-width: 760px; margin: 0 auto; padding: 22px 28px 80px; }
  article h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  article h2 { font-size: 18px; margin: 26px 0 8px; }
  article h3 { font-size: 15px; margin: 20px 0 6px; }
  article p, article li { line-height: 1.62; color: var(--ink); }
  article ul, article ol { padding-left: 22px; }
  article code {
    background: var(--plane); padding: 1px 5px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  article pre {
    background: var(--plane); padding: 11px 13px; border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--line);
  }
  article pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  article blockquote {
    margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--ink2); font-size: 14px;
  }
  article blockquote p { margin: 4px 0; }
  article table { border-collapse: collapse; font-size: 13.5px; margin: 10px 0; }
  article th, article td { border: 1px solid var(--line); padding: 5px 11px; text-align: left; }
  article th { background: var(--plane); font-size: 12px; }
  a.wl { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 35%, transparent); cursor: pointer; }
  a.wl:hover { border-bottom-color: var(--link); }
  a.wl.broken { color: var(--tag); border-bottom-style: dotted; }

  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .pill { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; background: var(--plane); color: var(--ink2); border: 1px solid var(--line); }
  .pill.type { background: var(--accent-soft); color: var(--link); border-color: transparent; }

  .backlinks { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  .backlinks h3 { margin-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .backlinks a { display: block; font-size: 13px; color: var(--link); text-decoration: none; padding: 3px 0; cursor: pointer; }

  .results { padding: 20px 28px; max-width: 760px; margin: 0 auto; }
  .result { padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .result h4 { margin: 0 0 2px; font-size: 15px; }
  .result p { margin: 0; font-size: 12.5px; color: var(--ink2); }
  .result mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; border-radius: 3px; }

  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .graphwrap { position: relative; height: 100%; overflow: hidden; }
  .graphhint { position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: var(--muted); pointer-events: none; }

  #gtip {
    position: absolute; display: none; pointer-events: none; z-index: 6;
    background: rgba(11,11,11,.9); color: #fff; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; line-height: 1.45; max-width: 240px;
  }
  #gtip .t2 { color: #c3c2b7; font-size: 10.5px; }

  .glegend {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    border: 1px solid var(--border-ring, rgba(11,11,11,.1));
    border-radius: 9px; padding: 8px 11px; font-size: 11px; color: var(--ink2); line-height: 1.8;
    pointer-events: none;
  }
  .glegend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .glegend .sw.hollow { background: transparent; border: 1.6px solid; }
  .glegend .dim { color: var(--muted); margin-top: 3px; }

  .gpanel {
    position: absolute; right: 12px; top: 12px; z-index: 5; width: 208px;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 10px 8px; font-size: 11.5px; color: var(--ink2);
    max-height: calc(100% - 24px); overflow-y: auto;
  }
  .gpanel details { border-bottom: 1px solid var(--line); padding: 4px 0; }
  .gpanel details:last-of-type { border-bottom: 0; }
  .gpanel summary {
    cursor: pointer; font-weight: 700; color: var(--ink); list-style: none;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 0;
  }
  .gpanel summary::-webkit-details-marker { display: none; }
  .gpanel summary::before { content: '▾ '; color: var(--muted); }
  .gpanel details:not([open]) summary::before { content: '▸ '; }
  .gpanel .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 3px 0; cursor: pointer;
  }
  .gpanel .row.dim { color: var(--muted); font-size: 10.5px; cursor: default; padding-top: 0; }
  .gpanel input[type=range] { width: 92px; accent-color: var(--accent); }
  .gpanel input[type=checkbox] { accent-color: var(--accent); }
  .gpanel .btn { width: 100%; margin-top: 6px; font-size: 11.5px; padding: 4px 8px; }

  @media (max-width: 820px) {
    .gpanel { width: 168px; font-size: 11px; }
    .gpanel input[type=range] { width: 66px; }
    .glegend { display: none; }
  }

  .capture { max-width: 720px; margin: 0 auto; padding: 22px 28px 80px; }
  .capture h2 { margin-top: 0; }
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .qcard .qnum { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .qcard .q { font-size: 16px; font-weight: 600; margin: 3px 0 4px; }
  .qcard .why { font-size: 12px; color: var(--ink2); margin-bottom: 9px; }
  .qcard textarea, .qcard input {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 14px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--plane); color: var(--ink); resize: vertical;
  }
  .qnav { display: flex; gap: 8px; align-items: center; }
  .btn { font: inherit; font-size: 13px; padding: 5px 13px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .prog { font-size: 11.5px; color: var(--muted); }
  #capture-out { width: 100%; min-height: 320px; font-family: ui-monospace, Menlo, monospace;
    font-size: 12.5px; line-height: 1.5; padding: 12px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--plane); color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink2); }
  footer { padding: 5px 16px; font-size: 10.5px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); }

  @media (max-width: 820px) {
    .main { flex-direction: column; }
    nav { width: 100%; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    article, .results, .capture { padding: 16px 16px 60px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>STS Second Brain</h1>
    <div class="sub" id="stats">loading vault…</div>
  </div>
  <input id="search" type="search" placeholder="Search notes…  (/ to focus)" autocomplete="off">
  <div class="seg" id="viewseg">
    <button data-v="note" class="on">Notes</button>
    <button data-v="graph">Graph</button>
    <button data-v="capture">Capture</button>
  </div>
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
</header>

<div class="main">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<footer id="foot">
  Markdown vault under <code>second-brain/</code> — open it directly in Obsidian. This viewer is generated from it; the notes are the source of truth.
</footer>

<script>
/* ------------------------------------------------------------------ state */
let VAULT = null;
let current = null;      // slug
let view = 'note';       // note | graph | capture
let activeTags = new Set();
let query = '';

const $ = (id) => document.getElementById(id);
const bySlug = () => VAULT.index;

/* ------------------------------------------------------------- markdown */
/* Small renderer. Deliberately not a library: the vault uses a narrow subset
   of Markdown, and wikilinks need resolving against the index anyway, which a
   generic renderer would not do. */
function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function inline(s) {
  s = esc(s);
  // wikilinks first, so their contents are not mangled by emphasis rules
  s = s.replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
    const slug = VAULT.names[target.trim().toLowerCase()];
    const text = (label ?? target).trim();
    return slug
      ? `<a class="wl" data-go="${slug}">${text}</a>`
      : `<a class="wl broken" title="No note called &quot;${target}&quot;">${text}</a>`;
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function renderMarkdown(md) {
  const lines = md.split('\n');
  const out = [];
  let i = 0;
  let list = null;

  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  while (i < lines.length) {
    const line = lines[i];

    if (line.startsWith('```')) {
      closeList();
      const lang = line.slice(3).trim();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code data-lang="${esc(lang)}">${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }

    // table
    if (line.includes('|') && lines[i + 1] && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      closeList();
      const cells = (r) => r.split('|').map((c) => c.trim()).filter((c, k, a) => !(c === '' && (k === 0 || k === a.length - 1)));
      out.push('<table><thead><tr>' + cells(line).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>');
      i += 2;
      while (i < lines.length && lines[i].includes('|')) {
        out.push('<tr>' + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>');
        i++;
      }
      out.push('</tbody></table>');
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }

    if (/^>\s?/.test(line)) {
      closeList();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${renderMarkdown(buf.join('\n'))}</blockquote>`);
      continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((ul ?? ol)[1])}</li>`);
      i++;
      continue;
    }

    if (line.trim() === '') { closeList(); i++; continue; }
    if (/^---+$/.test(line.trim())) { closeList(); i++; continue; }

    closeList();
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4}\s|>|\s*[-*]\s|\s*\d+\.\s|```)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  closeList();
  return out.join('\n');
}

/* ------------------------------------------------------------------- nav */
const GROUP_ORDER = ['moc', 'standard', 'material', 'method', 'skill', 'decision', 'report', 'reference', 'template', 'note'];
const GROUP_LABEL = {
  moc: 'Maps of content', standard: 'Standards', material: 'Materials',
  method: 'Methods', skill: 'Skills', decision: 'Decisions', report: 'Project reports',
  reference: 'Reference library',
  template: 'Templates', note: 'Notes',
};
/* Any type the list above does not know about still gets a group, so a note
   can never disappear from navigation just because its frontmatter used a word
   this file has not seen. */
function groupOrder(notes) {
  const seen = [...new Set(notes.map((n) => n.type))];
  return [...GROUP_ORDER, ...seen.filter((t) => !GROUP_ORDER.includes(t))];
}

function visibleNotes() {
  return VAULT.notes.filter((n) => {
    if (activeTags.size && ![...activeTags].every((t) => n.tags.includes(t))) return false;
    return true;
  });
}

function renderNav() {
  const nav = $('nav');
  const notes = visibleNotes();
  let html = '<div class="group">Tags</div><div class="tags">';
  for (const { tag, count } of VAULT.tags.slice(0, 22)) {
    html += `<span class="tag ${activeTags.has(tag) ? 'on' : ''}" data-tag="${tag}">#${tag} <span class="n">${count}</span></span>`;
  }
  html += '</div>';

  for (const g of groupOrder(notes)) {
    const inGroup = notes.filter((n) => n.type === g);
    if (!inGroup.length) continue;
    html += `<div class="group">${GROUP_LABEL[g] ?? g}</div>`;
    for (const n of inGroup.sort((a, b) => a.title.localeCompare(b.title))) {
      html += `<a class="note ${n.slug === current ? 'active' : ''}" data-go="${n.slug}">${esc(n.title)}
        <span class="snip">${n.backlinks.length} in · ${n.resolved.length} out</span></a>`;
    }
  }
  nav.innerHTML = html;
}

/* ---------------------------------------------------------------- render */
function renderNote(slug) {
  const n = bySlug()[slug];
  if (!n) return;
  current = slug;
  view = 'note';
  syncViewSeg();

  const meta = [
    `<span class="pill type">${n.type}</span>`,
    ...n.tags.map((t) => `<span class="pill" data-tag="${t}" style="cursor:pointer">#${t}</span>`),
    n.updated ? `<span class="pill">updated ${n.updated}</span>` : '',
    `<span class="pill">${n.path}</span>`,
  ].join('');

  const backlinks = n.backlinks.length
    ? `<div class="backlinks"><h3>Linked from (${n.backlinks.length})</h3>` +
      n.backlinks.map((b) => `<a data-go="${b}">← ${esc(bySlug()[b].title)}</a>`).join('') + '</div>'
    : `<div class="backlinks"><h3>Linked from</h3><p class="hint">Nothing links here yet. An orphan note is one you will not find again — link it from a map of content.</p></div>`;

  $('main').innerHTML = `<article><div class="meta">${meta}</div>${renderMarkdown(n.body)}${backlinks}</article>`;
  $('main').scrollTop = 0;
  renderNav();
  location.hash = slug;
}

function renderSearch() {
  const q = query.toLowerCase().trim();
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = visibleNotes()
    .map((n) => {
      const hay = (n.title + ' ' + n.tags.join(' ') + ' ' + n.text).toLowerCase();
      if (!terms.every((t) => hay.includes(t))) return null;
      let score = 0;
      for (const t of terms) {
        if (n.title.toLowerCase().includes(t)) score += 10;
        if (n.tags.some((x) => x.includes(t))) score += 5;
        score += (hay.split(t).length - 1);
      }
      const at = n.text.toLowerCase().indexOf(terms[0]);
      const start = Math.max(0, at - 60);
      let snip = esc(n.text.slice(start, start + 190));
      for (const t of terms) snip = snip.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>');
      return { n, score, snip: (start ? '…' : '') + snip + '…' };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score);

  $('main').innerHTML =
    `<div class="results"><p class="hint">${hits.length} note${hits.length === 1 ? '' : 's'} matching “${esc(query)}”${activeTags.size ? ' within the active tags' : ''}</p>` +
    hits.map((h) => `<div class="result" data-go="${h.n.slug}"><h4>${esc(h.n.title)}</h4><p>${h.snip}</p></div>`).join('') +
    (hits.length ? '' : '<p class="hint">Nothing found. Try a shorter term, or clear the tag filter.</p>') +
    '</div>';
}

/* ----------------------------------------------------------------- graph */
/**
 * Knowledge graph.
 *
 * Notes and tags are both nodes, which is what makes this a knowledge graph
 * rather than a link diagram: a tag is a real piece of structure connecting
 * notes that never cite each other, and hiding it loses that. Tags are drawn
 * smaller and hollow so they can never be mistaken for a note.
 *
 * Layout is a plain force simulation — repulsion between every pair, springs
 * along edges, a weak pull to centre so unconnected notes stay on screen, and
 * collision so labels do not stack. State lives outside the render function so
 * toggling a control does not throw away the layout you were looking at.
 */
const graphState = {
  nodes: null,
  links: null,
  cam: { x: 0, y: 0, k: 1 },
  opts: {
    showTags: true,
    showOrphans: true,
    showArrows: true,
    depth: 0, // 0 = whole vault; 1-3 = local graph around the open note
    textFade: 1.1, // zoom above which every label becomes a candidate
    nodeSize: 1,
    linkForce: 1,
    repel: 1.4,
    centre: 1.3,
  },
  built: null, // signature of the data the current layout was built from
};

const NODE_COLOUR = {
  moc: '#4a3aa7', standard: '#2a78d6', material: '#1baf7a',
  method: '#eb6834', skill: '#c23d80', decision: '#e34948', report: '#0f8f8a', reference: '#eda100',
  template: '#898781', note: '#898781',
};
const TAG_COLOUR = '#e87ba4';

/** Nodes within `depth` hops of the open note. depth 0 means everything. */
function withinDepth(nodes, links, rootId, depth) {
  if (!depth || !rootId) return null;
  const adj = new Map();
  for (const l of links) {
    (adj.get(l.a) ?? adj.set(l.a, []).get(l.a)).push(l.b);
    (adj.get(l.b) ?? adj.set(l.b, []).get(l.b)).push(l.a);
  }
  const seen = new Set([rootId]);
  let frontier = [rootId];
  for (let d = 0; d < depth; d++) {
    const next = [];
    for (const id of frontier) {
      for (const n of adj.get(id) ?? []) {
        if (!seen.has(n)) { seen.add(n); next.push(n); }
      }
    }
    frontier = next;
  }
  return seen;
}

function buildGraphData() {
  const o = graphState.opts;
  const notes = visibleNotes();
  const allowed = new Set(notes.map((n) => n.slug));

  const nodes = [];
  const links = [];

  for (const n of notes) {
    nodes.push({
      id: n.slug, kind: 'note', label: n.title, type: n.type,
      deg: 0, x: 0, y: 0, vx: 0, vy: 0,
    });
  }
  for (const n of notes) {
    for (const r of n.resolved) {
      if (allowed.has(r.slug)) links.push({ a: n.slug, b: r.slug, kind: 'link' });
    }
  }

  if (o.showTags) {
    const tagged = new Map();
    for (const n of notes) for (const t of n.tags) {
      if (!tagged.has(t)) tagged.set(t, []);
      tagged.get(t).push(n.slug);
    }
    for (const [t, members] of tagged) {
      // A tag on a single note adds a spur and no structure — skip it.
      if (members.length < 2) continue;
      const id = 'tag:' + t;
      nodes.push({ id, kind: 'tag', label: '#' + t, deg: 0, x: 0, y: 0, vx: 0, vy: 0 });
      for (const m of members) links.push({ a: m, b: id, kind: 'tag' });
    }
  }

  for (const l of links) {
    const A = nodes.find((n) => n.id === l.a);
    const B = nodes.find((n) => n.id === l.b);
    if (A) A.deg++;
    if (B) B.deg++;
  }

  let keep = nodes;
  const inDepth = withinDepth(nodes, links, current, o.depth);
  if (inDepth) keep = keep.filter((n) => inDepth.has(n.id));
  if (!o.showOrphans) keep = keep.filter((n) => n.deg > 0 || n.id === current);

  const keepIds = new Set(keep.map((n) => n.id));
  return {
    nodes: keep,
    links: links.filter((l) => keepIds.has(l.a) && keepIds.has(l.b)),
  };
}

function renderGraph() {
  view = 'graph';
  syncViewSeg();

  const o = graphState.opts;
  $('main').innerHTML = `
    <div class="graphwrap">
      <canvas id="graph"></canvas>
      <div id="gtip"></div>
      <div class="glegend" id="glegend"></div>
      <div class="gpanel">
        <details open>
          <summary>Filters</summary>
          <label class="row"><span>Tags as nodes</span><input type="checkbox" id="g-tags" ${o.showTags ? 'checked' : ''}></label>
          <label class="row"><span>Orphans</span><input type="checkbox" id="g-orph" ${o.showOrphans ? 'checked' : ''}></label>
          <label class="row"><span>Depth from open note</span><input type="range" id="g-depth" min="0" max="4" step="1" value="${o.depth}"></label>
          <div class="row dim"><span></span><span id="g-depth-l">${o.depth === 0 ? 'whole vault' : o.depth + ' hop' + (o.depth > 1 ? 's' : '')}</span></div>
        </details>
        <details open>
          <summary>Display</summary>
          <label class="row"><span>Arrows</span><input type="checkbox" id="g-arr" ${o.showArrows ? 'checked' : ''}></label>
          <label class="row"><span>Label threshold</span><input type="range" id="g-fade" min="0.4" max="2.2" step="0.1" value="${o.textFade}"></label>
          <label class="row"><span>Node size</span><input type="range" id="g-size" min="0.5" max="2.2" step="0.1" value="${o.nodeSize}"></label>
        </details>
        <details>
          <summary>Forces</summary>
          <label class="row"><span>Repel</span><input type="range" id="g-repel" min="0.3" max="2.5" step="0.1" value="${o.repel}"></label>
          <label class="row"><span>Link</span><input type="range" id="g-link" min="0.2" max="2.5" step="0.1" value="${o.linkForce}"></label>
          <label class="row"><span>Centre</span><input type="range" id="g-cent" min="0.2" max="2.5" step="0.1" value="${o.centre}"></label>
          <button class="btn" id="g-reset">Re-layout</button>
        </details>
      </div>
      <div class="graphhint">drag background to pan · drag a node to move it · scroll to zoom · click to open</div>
    </div>`;

  const cv = $('graph');
  const ctx = cv.getContext('2d');
  const tip = $('gtip');

  function rebuild(force) {
    const data = buildGraphData();
    const sig = JSON.stringify([data.nodes.map((n) => n.id), data.links.length, [...activeTags]]);
    if (!force && graphState.built === sig && graphState.nodes) {
      // Same data — keep the positions the user is looking at.
      const pos = new Map(graphState.nodes.map((n) => [n.id, n]));
      data.nodes.forEach((n) => {
        const p = pos.get(n.id);
        if (p) { n.x = p.x; n.y = p.y; n.vx = p.vx; n.vy = p.vy; n.fixed = p.fixed; }
        else seed(n, data.nodes.length);
      });
    } else {
      data.nodes.forEach((n, i) => seed(n, data.nodes.length, i));
    }
    graphState.built = sig;
    graphState.nodes = data.nodes;
    graphState.links = data.links;
    drawLegend();
  }
  function seed(n, total, i = Math.random() * total) {
    const a = (i / Math.max(total, 1)) * Math.PI * 2;
    const r = 150 + (n.kind === 'tag' ? 90 : 0);
    n.x = Math.cos(a) * r + (Math.random() - 0.5) * 30;
    n.y = Math.sin(a) * r + (Math.random() - 0.5) * 30;
    n.vx = 0; n.vy = 0;
  }
  rebuild(!graphState.nodes);

  const css = getComputedStyle(document.documentElement);
  const V = (k, f) => (css.getPropertyValue(k).trim() || f);

  function size() {
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = Math.max(1, r.width * devicePixelRatio);
    cv.height = Math.max(1, r.height * devicePixelRatio);
    cv.style.width = r.width + 'px';
    cv.style.height = r.height + 'px';
  }
  size();
  const ro = new ResizeObserver(size);
  ro.observe(cv.parentElement);

  const cam = graphState.cam;
  let hover = null, drag = null, panning = false, last = null;
  // A pointerup after a drag still fires click, which would open the note you
  // were only trying to move. Swallow that one click.
  let moved = false, downAt = null;

  const radius = (n) =>
    (n.kind === 'tag' ? 3.2 : 4.6) * o.nodeSize + Math.min(n.deg, 12) * 0.72 * o.nodeSize;

  /* Simulated annealing. Every force is scaled by a temperature that decays
     each frame, so the layout expands hot, cools, and then stops. Without it,
     a graph this dense (500+ edges) oscillates forever: springs pull discs
     into overlap, the overlap shove kicks them back apart, and every node
     jitters sideways for as long as the tab is open. */
  let alpha = 1, heatBase = 1, heatAt = performance.now();
  const reheat = (a) => {
    heatBase = Math.max(alpha, a);
    heatAt = performance.now();
    alpha = heatBase;
  };

  function step() {
    const nodes = graphState.nodes, links = graphState.links;
    const T = alpha;
    for (let a = 0; a < nodes.length; a++) {
      for (let b = a + 1; b < nodes.length; b++) {
        const A = nodes[a], B = nodes[b];
        let dx = B.x - A.x, dy = B.y - A.y;
        let d2 = dx * dx + dy * dy || 0.01;
        if (d2 > 160000) continue;
        const d = Math.sqrt(d2);
        // Repulsion, plus a hard shove when discs overlap so labels stay legible.
        let f = (2400 * o.repel) / d2;
        const minD = radius(A) + radius(B) + 12;
        /* The shove is gentle and cools with everything else — a stiff shove
           against 500 springs is exactly the oscillator we are damping out. */
        if (d < minD) f += (minD - d) * 0.45;
        const fx = (dx / d) * f * T, fy = (dy / d) * f * T;
        A.vx -= fx; A.vy -= fy; B.vx += fx; B.vy += fy;
      }
    }
    const byId = new Map(nodes.map((n) => [n.id, n]));
    for (const l of links) {
      const A = byId.get(l.a), B = byId.get(l.b);
      if (!A || !B) continue;
      const dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const rest = l.kind === 'tag' ? 120 : 95;
      const f = (d - rest) * 0.012 * o.linkForce * (l.kind === 'tag' ? 0.6 : 1) * T;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
    }
    let energy = 0;
    for (const n of nodes) {
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      /* Pull scales with degree, so hubs settle in the middle and leaves sit on
         the rim. With a flat pull the mass of a hub's own neighbours pushes it
         to the edge, which reads backwards — the busiest note looks peripheral. */
      const pull = 0.0015 * o.centre * (1 + Math.sqrt(n.deg) * 0.5) * T;
      n.vx -= n.x * pull;
      n.vy -= n.y * pull;
      n.vx *= 0.87; n.vy *= 0.87;
      // Cap the step so a crowded node cannot overshoot and ring back.
      const sp = Math.hypot(n.vx, n.vy);
      if (sp > 6) { n.vx *= 6 / sp; n.vy *= 6 / sp; }
      n.x += n.vx; n.y += n.vy;
      energy += n.vx * n.vx + n.vy * n.vy;
    }
    return energy / Math.max(nodes.length, 1);
  }

  /** Neighbours of the hovered node, for the highlight-and-dim pass. */
  function neighbourhood(id) {
    if (!id) return null;
    const set = new Set([id]);
    for (const l of graphState.links) {
      if (l.a === id) set.add(l.b);
      if (l.b === id) set.add(l.a);
    }
    return set;
  }

  function draw() {
    const nodes = graphState.nodes, links = graphState.links;
    const W = cv.width, H = cv.height, dpr = devicePixelRatio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(cam.k * dpr, 0, 0, cam.k * dpr, W / 2 + cam.x * dpr, H / 2 + cam.y * dpr);

    const near = neighbourhood(hover?.id);
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const lineBase = V('--line', '#e1e0d9');
    const accent = V('--accent', '#2a78d6');
    const ink = V('--ink', '#0b0b0b');

    ctx.lineWidth = 1 / cam.k;
    for (const l of links) {
      const A = byId.get(l.a), B = byId.get(l.b);
      if (!A || !B) continue;
      const lit = near && near.has(A.id) && near.has(B.id);
      ctx.globalAlpha = near ? (lit ? 1 : 0.07) : (l.kind === 'tag' ? 0.34 : 0.62);
      ctx.strokeStyle = lit ? accent : lineBase;
      ctx.lineWidth = (lit ? 1.8 : 1) / cam.k;
      if (l.kind === 'tag') ctx.setLineDash([3 / cam.k, 3 / cam.k]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();

      if (o.showArrows && l.kind === 'link' && (!near || lit)) {
        const dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 1;
        const ux = dx / d, uy = dy / d;
        const tipX = B.x - ux * (radius(B) + 2 / cam.k);
        const tipY = B.y - uy * (radius(B) + 2 / cam.k);
        const s = 5 / cam.k;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - ux * s - uy * s * 0.55, tipY - uy * s + ux * s * 0.55);
        ctx.lineTo(tipX - ux * s + uy * s * 0.55, tipY - uy * s - ux * s * 0.55);
        ctx.closePath();
        ctx.fillStyle = lit ? accent : lineBase;
        ctx.fill();
      }
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    for (const n of nodes) {
      const r = radius(n);
      const dim = near && !near.has(n.id);
      ctx.globalAlpha = dim ? 0.16 : 1;

      if (!dim && (n.id === current || hover?.id === n.id)) {
        // Soft halo marks the open note and whatever is under the cursor.
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 5 / cam.k, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        ctx.globalAlpha = 0.18;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      if (n.kind === 'tag') {
        ctx.fillStyle = V('--surface', '#fcfcfb');
        ctx.fill();
        ctx.strokeStyle = TAG_COLOUR;
        ctx.lineWidth = 1.6 / cam.k;
        ctx.stroke();
      } else {
        ctx.fillStyle = NODE_COLOUR[n.type] ?? '#898781';
        ctx.fill();
        if (n.id === current) {
          ctx.strokeStyle = ink;
          ctx.lineWidth = 2 / cam.k;
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;
    }

    /* Labels last, and only where they fit.
       Drawing every label turns the graph into a wall of overlapping text, so
       candidates are taken in priority order — hovered, open note, then by
       degree — and any whose box would collide with one already placed is
       dropped. The important nodes keep their names; the rest reveal theirs on
       hover or as you zoom in. */
    const placed = [];
    const candidates = [...nodes].sort((a, b) => {
      const rank = (n) => (n.id === hover?.id ? 3 : n.id === current ? 2 : 0);
      return (rank(b) - rank(a)) || (b.deg - a.deg);
    });
    for (const n of candidates) {
      const dim = near && !near.has(n.id);
      if (dim) continue;
      const forced = n.id === hover?.id || n.id === current;
      // Tags only earn a label once you have zoomed in on them.
      if (!forced && n.kind === 'tag' && cam.k < 1.4) continue;
      if (!forced && cam.k < o.textFade && n.deg < 4) continue;

      const fs = (n.kind === 'tag' ? 10 : 11.5) / cam.k;
      ctx.font = `${n.kind === 'tag' ? 400 : 600} ${fs}px system-ui, sans-serif`;
      const text = n.label.length > 28 ? n.label.slice(0, 27) + '…' : n.label;
      const w = ctx.measureText(text).width;
      const y = n.y + radius(n) + fs + 1 / cam.k;
      const box = { x0: n.x - w / 2, x1: n.x + w / 2, y0: y - fs, y1: y + fs * 0.35 };
      const clash = placed.some((b) =>
        box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0);
      if (clash && !forced) continue;
      placed.push(box);

      ctx.lineWidth = 3.5 / cam.k;
      ctx.strokeStyle = V('--plane', '#f2f2ef');
      ctx.strokeText(text, n.x, y);
      ctx.fillStyle = n.kind === 'tag' ? V('--ink2', '#52514e') : ink;
      ctx.fillText(text, n.x, y);
    }
  }

  /* Let the simulation settle, then frame it. Without this the initial camera
     is a guess and low-degree nodes drift off the edge where nobody sees them. */
  function fitView() {
    const nodes = graphState.nodes;
    if (!nodes.length) return;
    const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
    const w = Math.max(...xs) - Math.min(...xs);
    const h = Math.max(...ys) - Math.min(...ys);
    const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
    const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
    const vw = cv.width / devicePixelRatio, vh = cv.height / devicePixelRatio;
    cam.k = Math.max(0.25, Math.min(2.2, Math.min(vw / (w + 190), vh / (h + 150))));
    cam.x = -cx * cam.k;
    cam.y = -cy * cam.k;
  }

  let alive = true, frames = 0, fitted = false;
  (function loop() {
    if (!alive || view !== 'graph') { ro.disconnect(); return; }
    /* Once cold, stop stepping entirely — a frozen layout costs nothing and
       cannot jitter. Interaction reheats it. Cooling is wall-clock, not
       per-frame, so a slow machine still freezes in the same ~6 seconds. */
    const hot = alpha > 0.004 || drag;
    const energy = hot ? step() : 0;
    if (hot && !drag) {
      const elapsed = (performance.now() - heatAt) / 1000;
      alpha = heatBase * Math.pow(0.985, elapsed * 60);
    }
    frames++;
    /* Fit once the layout has stopped moving. A fixed frame count fires while
       the graph is still expanding, which framed a view that immediately grew
       out of it. The frame cap is a backstop for layouts that never settle. */
    if (!fitted && (energy < 0.04 || frames > 400)) { fitView(); fitted = true; }
    draw();
    requestAnimationFrame(loop);
  })();

  function toWorld(ev) {
    const r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left - r.width / 2 - cam.x) / cam.k,
      y: (ev.clientY - r.top - r.height / 2 - cam.y) / cam.k,
    };
  }
  function pick(ev) {
    const p = toWorld(ev);
    let best = null, bd = Infinity;
    for (const n of graphState.nodes) {
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < Math.max(radius(n) + 6 / cam.k, 10 / cam.k) && d < bd) { bd = d; best = n; }
    }
    return best;
  }

  cv.addEventListener('pointerdown', (e) => {
    const n = pick(e);
    moved = false;
    downAt = { x: e.clientX, y: e.clientY };
    if (n) { drag = n; n.fixed = true; cv.setPointerCapture(e.pointerId); }
    else { panning = true; last = e; }
    cv.style.cursor = 'grabbing';
  });
  addEventListener('pointerup', () => {
    if (drag) { drag.fixed = false; drag = null; reheat(0.3); }
    panning = false;
    cv.style.cursor = 'grab';
  });
  cv.addEventListener('pointermove', (e) => {
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) moved = true;
    if (drag) {
      const p = toWorld(e);
      drag.x = p.x; drag.y = p.y; drag.vx = 0; drag.vy = 0;
      reheat(0.3);
      return;
    }
    if (panning && last) {
      cam.x += e.clientX - last.clientX;
      cam.y += e.clientY - last.clientY;
      last = e;
      return;
    }
    hover = pick(e);
    cv.style.cursor = hover ? 'pointer' : 'grab';
    if (hover) {
      const r = cv.getBoundingClientRect();
      const note = hover.kind === 'note' ? bySlug()[hover.id] : null;
      tip.style.display = 'block';
      tip.style.left = (e.clientX - r.left + 14) + 'px';
      tip.style.top = (e.clientY - r.top + 10) + 'px';
      tip.innerHTML = note
        ? `<b>${esc(note.title)}</b><div class="t2">${note.type} · ${note.backlinks.length} in · ${note.resolved.length} out</div>`
        : `<b>${esc(hover.label)}</b><div class="t2">tag · ${hover.deg} notes</div>`;
    } else {
      tip.style.display = 'none';
    }
  });
  cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; hover = null; });

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const sx = e.clientX - r.left - r.width / 2;
    const sy = e.clientY - r.top - r.height / 2;
    const wx = (sx - cam.x) / cam.k, wy = (sy - cam.y) / cam.k;
    cam.k = Math.max(0.2, Math.min(4, cam.k * (e.deltaY > 0 ? 0.88 : 1.12)));
    // Keep the point under the cursor pinned while zooming.
    cam.x = sx - wx * cam.k;
    cam.y = sy - wy * cam.k;
  }, { passive: false });

  cv.addEventListener('click', (e) => {
    if (moved) { moved = false; downAt = null; return; }
    downAt = null;
    const n = pick(e);
    if (!n) return;
    if (n.kind === 'tag') {
      const t = n.label.slice(1);
      activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
      renderNav();
      rebuild(true);
      reheat(1); frames = 0; fitted = false;
      return;
    }
    alive = false;
    renderNote(n.id);
  });

  function drawLegend() {
    const types = [...new Set((graphState.nodes ?? []).filter((n) => n.kind === 'note').map((n) => n.type))];
    const tagCount = (graphState.nodes ?? []).filter((n) => n.kind === 'tag').length;
    $('glegend').innerHTML =
      types.map((t) => `<div><span class="sw" style="background:${NODE_COLOUR[t] ?? '#898781'}"></span>${t}</div>`).join('') +
      (tagCount ? `<div><span class="sw hollow" style="border-color:${TAG_COLOUR}"></span>tag (${tagCount}) — click to filter</div>` : '') +
      `<div class="dim">${(graphState.nodes ?? []).length} nodes · ${(graphState.links ?? []).length} edges</div>`;
  }
  drawLegend();

  const bind = (id, key, kind) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener('input', () => {
      o[key] = kind === 'bool' ? el.checked : Number(el.value);
      reheat(0.6);
      if (kind === 'bool' || key === 'depth') {
        if (key === 'depth') {
          $('g-depth-l').textContent = o.depth === 0 ? 'whole vault' : o.depth + ' hop' + (o.depth > 1 ? 's' : '');
        }
        rebuild(true);
        reheat(1); frames = 0; fitted = false;
      }
    });
  };
  bind('g-tags', 'showTags', 'bool');
  bind('g-orph', 'showOrphans', 'bool');
  bind('g-arr', 'showArrows', 'bool');
  bind('g-depth', 'depth', 'num');
  bind('g-fade', 'textFade', 'num');
  bind('g-size', 'nodeSize', 'num');
  bind('g-repel', 'repel', 'num');
  bind('g-link', 'linkForce', 'num');
  bind('g-cent', 'centre', 'num');
  $('g-reset').addEventListener('click', () => {
    rebuild(true);
    frames = 0; fitted = false; // settle again, then re-fit
  });
}

/* --------------------------------------------------------------- capture */
/* Reverse prompting made concrete: rather than facing an empty note, you are
   asked for the parts that are hard to reconstruct later. The bank is fixed
   rather than model-generated so it works offline and produces the same shape
   every time. */
const BANKS = {
  'site-visit': {
    label: 'Site inspection',
    type: 'note',
    tags: ['site', 'inspection'],
    dir: 'notes',
    questions: [
      { k: 'site', q: 'Which site, and what was the job number?', why: 'The first thing you will search on in two years.', short: true },
      { k: 'brief', q: 'What were you actually asked to determine?', why: 'Separates what you set out to do from what you happened to notice.' },
      { k: 'observed', q: 'What did you see? Materials, depths, and what each depth was measured from.', why: 'A depth without its reference surface is unusable later.' },
      { k: 'surprise', q: 'What was different from what you expected walking in?', why: 'The gap between expectation and observation is where the knowledge is. This is the question people skip.' },
      { k: 'judgement', q: 'What call did you make that another engineer might have made differently?', why: 'Records the judgement, not just the outcome — so it can be defended or revisited.' },
      { k: 'unknown', q: 'What could you not establish, and why?', why: 'Absence of a note reads as absence of a problem. Write the gap down.' },
      { k: 'next', q: 'What has to happen next, and who owns it?', why: 'Turns a note into something actionable.', short: true },
    ],
  },
  'lesson': {
    label: 'Lesson learned',
    type: 'note',
    tags: ['lesson'],
    dir: 'notes',
    questions: [
      { k: 'what', q: 'What happened?', why: 'Facts first, no interpretation yet.' },
      { k: 'expected', q: 'What did you expect to happen instead?', why: 'A lesson is the size of the gap between these two answers.' },
      { k: 'cause', q: 'What actually caused the gap?', why: 'Push past the first answer. The first answer is usually a symptom.' },
      { k: 'signal', q: 'What was the earliest signal you could have caught it on?', why: 'This is the reusable part — the rest is history.' },
      { k: 'change', q: 'What will you do differently, specifically enough that someone else could follow it?', why: '"Be more careful" is not a change.' },
    ],
  },
  'decision': {
    label: 'Decision',
    type: 'decision',
    tags: ['decision'],
    dir: 'decisions',
    questions: [
      { k: 'decision', q: 'State the decision in one sentence, present tense.', why: 'If it takes a paragraph it is not yet a decision.', short: true },
      { k: 'problem', q: 'What problem forced it? What went wrong, or would have?', why: 'Without the problem the decision looks arbitrary in six months.' },
      { k: 'options', q: 'What else was on the table, and why did each lose?', why: 'Stops the rejected options being re-proposed forever.' },
      { k: 'consequences', q: 'What does this make easy, and what does it make harder?', why: 'Both halves. A decision with no downside was not a decision.' },
      { k: 'cost', q: 'What did you accept to get it?', why: 'If nothing was traded, check whether a real decision was made.' },
      { k: 'revisit', q: 'What would have to change for this to be worth revisiting?', why: 'Gives the decision an expiry condition instead of an indefinite life.' },
    ],
  },
  'material': {
    label: 'Material / ground condition',
    type: 'material',
    tags: ['material'],
    dir: 'materials',
    questions: [
      { k: 'name', q: 'What is the material, described as you would log it?', why: 'Use the logging order so the note matches the log.', short: true },
      { k: 'where', q: 'Where does it occur, and in what typical thickness?', why: 'Turns a description into something predictive.' },
      { k: 'behaviour', q: 'How does it behave when you work it — excavation, exposure, water?', why: 'The part that never makes it into the standard description.' },
      { k: 'confusion', q: 'What is it commonly confused with, and how do you tell them apart?', why: 'The single most useful thing an experienced logger knows.' },
      { k: 'source', q: 'Which project and report is this drawn from?', why: 'A figure without a source cannot be defended.', short: true },
    ],
  },
};

let capture = { bank: null, i: 0, answers: {}, title: '' };

function renderCapture() {
  view = 'capture';
  syncViewSeg();
  const m = $('main');

  if (!capture.bank) {
    m.innerHTML = `<div class="capture">
      <h2>Capture</h2>
      <p class="hint">Rather than starting from a blank note, pick what you are recording and answer a short set of questions. The questions aim at what is hard to reconstruct later — the surprise, the judgement call, the thing you could not establish. You get a vault-ready Markdown file at the end.</p>
      <div class="qcard">
        <div class="qnum">Step 1</div>
        <div class="q">What are you capturing?</div>
        <div class="qnav" style="flex-wrap:wrap">
          ${Object.entries(BANKS).map(([k, b]) => `<button class="btn" data-bank="${k}">${b.label} <span class="prog">· ${b.questions.length} questions</span></button>`).join('')}
        </div>
      </div>
      <p class="hint">See <a class="wl" data-go="methods/reverse-prompting">Reverse prompting</a> for why this is shaped as an interview.</p>
    </div>`;
    return;
  }

  const bank = BANKS[capture.bank];
  if (capture.i >= bank.questions.length) return renderCaptureOutput();

  const q = bank.questions[capture.i];
  m.innerHTML = `<div class="capture">
    <h2>${bank.label}</h2>
    ${capture.i === 0 ? `<div class="qcard"><div class="qnum">Title</div><div class="q">Give this note a title</div>
      <input id="cap-title" value="${esc(capture.title)}" placeholder="e.g. Carter St Lidcombe pier inspection"></div>` : ''}
    <div class="qcard">
      <div class="qnum">Question ${capture.i + 1} of ${bank.questions.length}</div>
      <div class="q">${esc(q.q)}</div>
      <div class="why">${esc(q.why)}</div>
      ${q.short
        ? `<input id="cap-in" value="${esc(capture.answers[q.k] ?? '')}">`
        : `<textarea id="cap-in" rows="5">${esc(capture.answers[q.k] ?? '')}</textarea>`}
    </div>
    <div class="qnav">
      <button class="btn" id="cap-back" ${capture.i === 0 ? 'disabled' : ''}>← Back</button>
      <button class="btn primary" id="cap-next">${capture.i === bank.questions.length - 1 ? 'Build note' : 'Next →'}</button>
      <button class="btn" id="cap-skip">Skip</button>
      <span class="prog">Blank answers are left out of the note rather than filled in.</span>
    </div>
  </div>`;
  const input = $('cap-in');
  input.focus();
  const save = () => { capture.answers[q.k] = input.value.trim(); if ($('cap-title')) capture.title = $('cap-title').value.trim(); };
  $('cap-next').onclick = () => { save(); capture.i++; renderCapture(); };
  $('cap-skip').onclick = () => { capture.answers[q.k] = ''; capture.i++; renderCapture(); };
  $('cap-back').onclick = () => { save(); capture.i--; renderCapture(); };
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || q.short)) { e.preventDefault(); save(); capture.i++; renderCapture(); }
  };
}

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'untitled';
}

function renderCaptureOutput() {
  const bank = BANKS[capture.bank];
  const title = capture.title || bank.label;
  const today = new Date().toISOString().slice(0, 10);
  const answered = bank.questions.filter((q) => (capture.answers[q.k] ?? '').length);
  const skipped = bank.questions.filter((q) => !(capture.answers[q.k] ?? '').length);

  let md = `---\ntitle: ${title}\ntype: ${bank.type}\ntags: [${bank.tags.join(', ')}]\nupdated: ${today}\n---\n\n# ${title}\n\n`;
  for (const q of answered) {
    md += `## ${q.q.replace(/\?$/, '')}\n\n${capture.answers[q.k]}\n\n`;
  }
  if (skipped.length) {
    md += `## Not yet captured\n\n${skipped.map((q) => `- ${q.q}`).join('\n')}\n\n`;
  }
  md += `## Related\n\n- [[Index]]\n`;

  const path = `second-brain/${bank.dir}/${slugify(title)}.md`;
  $('main').innerHTML = `<div class="capture">
    <h2>Note ready</h2>
    <p class="hint">Save as <code>${path}</code>, then run <code>node scripts/build-vault-index.mjs</code> and redeploy. Add <code>[[wikilinks]]</code> to connect it — an unlinked note is one you will not find again.</p>
    <textarea id="capture-out" spellcheck="false">${esc(md)}</textarea>
    <div class="qnav" style="margin-top:10px">
      <button class="btn primary" id="cap-copy">Copy Markdown</button>
      <button class="btn" id="cap-dl">Download .md</button>
      <button class="btn" id="cap-again">Start another</button>
      ${skipped.length ? `<span class="prog">${skipped.length} question${skipped.length === 1 ? '' : 's'} left blank — listed in the note so the gap stays visible.</span>` : ''}
    </div>
  </div>`;
  $('cap-copy').onclick = async () => {
    await navigator.clipboard.writeText($('capture-out').value);
    $('cap-copy').textContent = 'Copied';
    setTimeout(() => ($('cap-copy').textContent = 'Copy Markdown'), 1400);
  };
  $('cap-dl').onclick = () => {
    const blob = new Blob([$('capture-out').value], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = slugify(title) + '.md';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('cap-again').onclick = () => { capture = { bank: null, i: 0, answers: {}, title: '' }; renderCapture(); };
}

/* ------------------------------------------------------------------ wire */
function syncViewSeg() {
  document.querySelectorAll('#viewseg button').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
}

function route() {
  if (query) return renderSearch();
  if (view === 'graph') return renderGraph();
  if (view === 'capture') return renderCapture();
  renderNote(current ?? VAULT.notes[0].slug);
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); query = ''; $('search').value = ''; renderNote(go.dataset.go); return; }
  const tag = e.target.closest('[data-tag]');
  if (tag) {
    const t = tag.dataset.tag;
    activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
    renderNav();
    if (query) renderSearch(); else if (view === 'graph') renderGraph();
    return;
  }
  const bank = e.target.closest('[data-bank]');
  if (bank) { capture = { bank: bank.dataset.bank, i: 0, answers: {}, title: '' }; renderCapture(); return; }
});

$('viewseg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v;
  query = ''; $('search').value = '';
  route();
});

$('search').addEventListener('input', (e) => {
  query = e.target.value;
  if (query) renderSearch();
  else route();
});

addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); $('search').focus();
  }
  if (e.key === 'Escape') { query = ''; $('search').value = ''; $('search').blur(); route(); }
});

$('theme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme')
    ? r.getAttribute('data-theme') === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
});

addEventListener('hashchange', () => {
  const s = location.hash.slice(1);
  if (s && bySlug()[s] && s !== current) renderNote(s);
});

/* ------------------------------------------------------------------ boot */
/* Revalidate rather than trusting the HTTP cache: the vault is regenerated
   whenever notes change, and a stale index would show the wrong note count
   and silently miss new notes until a hard refresh. */
fetch('vault.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error('vault.json ' + r.status); return r.json(); })
  .then((v) => {
    VAULT = v;
    VAULT.index = Object.fromEntries(v.notes.map((n) => [n.slug, n]));
    VAULT.names = {};
    for (const n of v.notes) {
      VAULT.names[n.title.toLowerCase()] = n.slug;
      VAULT.names[n.slug.toLowerCase()] = n.slug;
      VAULT.names[n.slug.split('/').pop().toLowerCase()] = n.slug;
      for (const a of n.aliases) VAULT.names[String(a).toLowerCase()] = n.slug;
    }
    $('stats').textContent =
      `${v.counts.notes} notes · ${v.counts.links} links · ${v.counts.tags} tags` +
      (v.counts.unresolved ? ` · ${v.counts.unresolved} broken` : '');
    renderNav();
    const start = location.hash.slice(1);
    current = VAULT.index[start] ? start : (VAULT.index['00-index'] ? '00-index' : v.notes[0].slug);
    route();
  })
  .catch((err) => {
    $('main').innerHTML = `<div class="results"><h2>Vault not loaded</h2><p class="hint">${esc(String(err.message))}</p>
      <p class="hint">Run <code>node scripts/build-vault-index.mjs</code> to generate <code>vault.json</code> from the Markdown.</p></div>`;
  });
</script>
</body>
</html>
